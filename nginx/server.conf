##
# security
#
#

add_header X-Frame-Options "SAMEORIGIN";
add_header X-XSS-Protection "1; mode=block";
add_header X-Content-Type-Options "nosniff";
add_header Referrer-Policy "no-referrer-when-downgrade";
add_header Permissions-Policy "fullscreen=*";
add_header Strict-Transport-Security "max-age=63072000";


##
# custom settings
#
#

# Change // -> / for all URLs, so it works for our php location block, to merge_slashes off;
merge_slashes off;
rewrite ^(.*)//+(.*)$ $1/$2 permanent;

# 301 Redirect URLs with trailing /'s
rewrite ^([^.]*[^/])$ $1/ permanent;

# For WordPress bots/users
rewrite ^/wp-login.php$ https://wordpress.com/wp-login.php permanent;
rewrite ^/wp-content/plugins/seoplugins/mar.php$ https://wordpress.com/wp-login.php permanent;
location ~ ^/(wp-login|wp-admin|wp-config|wp-content|wp-includes|xmlrpc) {
    return 301 https://wordpress.com/wp-login.php;
}

# Don't send the nginx version number in error pages and Server header
server_tokens off;


##
# cache control settings
#
#
location ~* \.(?:jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp3|mp4|ogg|ogv|webm|htc|webp)$ {
    # Uncomment these lines if you want to serve up a placeholder image for 404s
    # for static assets:
    # error_page 404 /img/placeholder-image.png;
    # try_files $uri =404;
    etag off;
    expires 1M;
    access_log off;
    # Route any 404s back through Craft
    try_files $uri /index.php?$query_string;
    # max-age=2592000 = 1 month in seconds, stale-while-revalidate=86400 = 1 day in seconds
    add_header Cache-Control "public, max-age=2592000, must-revalidate, stale-while-revalidate=86400";
}

# CSS and Javascript
location ~* \.(?:css|js)$ {
    etag off;
    expires 1y;
    access_log off;
    # Route any 404s back through Craft
    try_files $uri /index.php?$query_string;
    # max-age=31556952 = 1 year in seconds
    add_header Cache-Control "public, max-age=31556952, immutable";
}

# WebFonts
location ~* \.(?:ttf|ttc|otf|eot|woff|woff2)$ {
    etag off;
    add_header "Access-Control-Allow-Origin" "*";
    expires 1M;
    access_log off;
    # Route any 404s back through Craft
    try_files $uri /index.php?$query_string;
    # max-age=2592000 = 1 month in seconds, stale-while-revalidate=86400 = 1 day in seconds
    add_header Cache-Control "public, max-age=2592000, must-revalidate, stale-while-revalidate=86400";
 }


##
# `gzip` Settings
#
#
gzip on;
gzip_disable "msie6";

gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_buffers 16 8k;
gzip_http_version 1.1;
gzip_min_length 256;
gzip_types
application/atom+xml
application/geo+json
application/javascript
application/x-javascript
application/json
application/ld+json
application/manifest+json
application/rdf+xml
application/rss+xml
application/xhtml+xml
application/xml
font/eot
font/otf
font/ttf
image/svg+xml
text/css
text/javascript
text/plain
text/xml;



