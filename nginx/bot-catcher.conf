# Block vulnerability scanners on non-WordPress sites (Craft CMS, etc.)
# Comment out or remove this include if the site runs WordPress.
#
# Include inside each site server { } block:
#   include /home/ploi/WEBSITE_NAME/nginx/bot-catcher.conf;
#
# Uses ^~ prefix and = exact locations so these win over Ploi/Craft extension
# regexes (\.css, \.txt, \.php) regardless of include order in the merged config.

# --- Outlook Autodiscover (POST to root domain is normal; do not pass to Craft) ---
# autodiscover.bensonradiology.com.au already points at Microsoft, but Office still
# probes https://bensonradiology.com.au/autodiscover/... on the website vhost.
# access_log off: keeps fail2ban nginx-404 from banning staff IPs (138.217.*).
location ^~ /autodiscover/ {
    access_log off;
    default_type text/plain;
    return 404 '';
}
location ^~ /Autodiscover/ {
    access_log off;
    default_type text/plain;
    return 404 '';
}
location ^~ /AutoDiscover/ {
    access_log off;
    default_type text/plain;
    return 404 '';
}

# --- Fake WordPress install roots (scanner prefixes from logs) ---
# Matches wp-content, wp-includes, wp-admin, wp-login.php under each tree.
location ^~ /blog/wp- {
    access_log /var/log/nginx/403-spam.log main;
    return 403;
}
location ^~ /blogs/wp- {
    access_log /var/log/nginx/403-spam.log main;
    return 403;
}
location ^~ /news/wp- {
    access_log /var/log/nginx/403-spam.log main;
    return 403;
}
location ^~ /wp/ {
    access_log /var/log/nginx/403-spam.log main;
    return 403;
}
location ^~ /wordpress/ {
    access_log /var/log/nginx/403-spam.log main;
    return 403;
}

# --- Standard root-level WordPress paths ---
location ^~ /wp-admin/ {
    access_log /var/log/nginx/403-spam.log main;
    return 403;
}
location ^~ /wp-content/ {
    access_log /var/log/nginx/403-spam.log main;
    return 403;
}
location ^~ /wp-includes/ {
    access_log /var/log/nginx/403-spam.log main;
    return 403;
}
location ^~ /wp-json/ {
    access_log /var/log/nginx/403-spam.log main;
    return 403;
}

# Exact files (= beats all prefix/regex locations, including location ~ \.php$)
location = /wp-login.php {
    access_log /var/log/nginx/403-spam.log main;
    return 403;
}
location = /xmlrpc.php {
    access_log /var/log/nginx/403-spam.log main;
    return 403;
}
location = /wp-config.php {
    access_log /var/log/nginx/403-spam.log main;
    return 403;
}
location = /wlwmanifest.xml {
    access_log /var/log/nginx/403-spam.log main;
    return 403;
}

# Probes that place wp files under /uploads/ (not a real Craft path)
location = /uploads/wp-login.php {
    access_log /var/log/nginx/403-spam.log main;
    return 403;
}

# --- Fallback regex for WP paths not covered above (include after ^~ blocks) ---
# wp-config backups, xmrlpc alias, stray wp-*.php anywhere in URI
location ~* (wp-config\.|xmrlpc|wp-links-opml\.php|wp-activate\.php|wp-signup\.php|wp-comments-post\.php|wp-cron\.php) {
    access_log /var/log/nginx/403-spam.log main;
    return 403;
}

# --- Other CMS / exploit probes (not WordPress-specific) ---
location ~* ^/(phpMyAdmin|phpmyadmin|phpunit|\.git/|\.env|\.env\.|config/|database/|backup/|old/|db\.zip|vendor/|server-status|shell|remote/login|bbclive|GponForm|diag_Form|cgi-bin/luci/|actuator/gateway/routes|application\.yaml|user_panel|app/\.git/config|aaa9|aab9|l9explore)(/|$) {
    access_log /var/log/nginx/403-spam.log main;
    return 403;
}

location ~* ^/(magento_version|joomla\.xml|_profiler/phpinfo)(/|$) {
    access_log /var/log/nginx/403-spam.log main;
    return 403;
}
