<html lang="en">
<head>
  <title>Email Template</title>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!--[if gte mso 9]>
  <xml>
     <o:OfficeDocumentSettings>
        <o:AllowPNG/>
        <o:PixelsPerInch>96</o:PixelsPerInch>
     </o:OfficeDocumentSettings>
  </xml>
  <![endif]-->
  <style type="text/css">
    /* Client-specific Styles */
    #outlook a {padding:0;} /* Force Outlook to provide a "view in browser" menu link. */
    body{width:100% !important; background-color: #ececec; -webkit-text-size-adjust:100%; -ms-text-size-adjust:100%; margin:0; padding:0;}
    /* Prevent Webkit and Windows Mobile platforms from changing default font sizes, while not breaking desktop design. */
    .ExternalClass {width:100%;} /* Force Hotmail to display emails at full width */
    .ExternalClass, .ExternalClass p, .ExternalClass span, .ExternalClass font, .ExternalClass td, .ExternalClass div {line-height: 100%;} /* Force Hotmail to display normal line spacing.  More on that: http://www.emailonacid.com/forum/viewthread/43/ */
    #backgroundTable {margin:0; padding:0; width:100% !important; line-height: 100% !important;}
    img {outline:none; text-decoration:none;border:none; -ms-interpolation-mode: bicubic;}
    a img {border:none;}
    .image_fix {display:block;}
    p {margin: 0px 0px !important;}
    a {color: #000;}

    table td {border-collapse: collapse;}
    table { border-collapse:collapse; mso-table-lspace:0pt; mso-table-rspace:0pt; }
    /*a {color: #e95353;text-decoration: none;text-decoration:none!important;}*/
    /*STYLES*/
    table[class=full] { width: 100%; clear: both; }

    table.devicewidth {width:100%!important;text-align:center!important;}
    table.devicewidthinner {width:600px!important;text-align:center!important;}
    table.devicewidthinnersuper {width:500px!important;text-align:center!important;}

/*    table[class=header] {
      background: #ececec url('images/header-bg.jpg') 50% 0 no-repeat;
      background-size: cover;
    }*/

    .header_td,
    .header_td p,
    .header_paragraph {
      font-family: Arial, sans-serif;
      font-size: 32px;
      color: #000000;
      text-align:left;
      font-weight: 700;
      line-height: 1.3;
    }

    .intro_td,
    .intro_td p,
    .intro_paragraph {
      font-family: Arial, sans-serif;
      font-size: 18px;
      color: #000000;
      text-align:left;
      font-weight: 300;
      line-height: 1.5;
    }

    .intro_td a,
    .intro_paragraph a,
    .intro_link {
      color: #ececec;
    }

    .divider {
      border-bottom: 1px solid #000;
    }

    .noimages {
      font-family: Arial, sans-serif;
      font-size: 12px;
      color: #ffffff;
    }

    .noimages a {
      text-decoration: none;
      color: #ffffff;
    }

    .unsub {
      font-family: Arial, sans-serif;
      font-size: 12px;
      color: #979797;
      text-align: center;
    }

    .unsub a {
      color: #979797;
    }

    img[class="header_image"] {
      width: 600px;
      display: block;
      border: none;
      outline: none;
      text-decoration: none;
    }

    table[class="mobile_spacing"] {display: none;}

    .headerimage {display: block!important;}

    /*################################################*/
    /*IPAD STYLES*/
    /*################################################*/
    @media only screen and (max-width: 640px) {
    a[href^="tel"], a[href^="sms"] {
    text-decoration: none;
    color: #ffffff; /* or whatever your want */
    pointer-events: none;
    cursor: default;
    }
    .mobile_link a[href^="tel"], .mobile_link a[href^="sms"] {
    text-decoration: default;
    color: #ffffff !important;
    pointer-events: auto;
    cursor: default;
    }
    .l_left,
    .l_left p {
      text-align: center;
    }
    table.devicewidth {width:100%!important;text-align:center!important;}
    table.devicewidthinner {width:400px!important;text-align:center!important;}
    table.devicewidthinnersuper {width:320px!important;text-align:center!important;}
    table.mobile_spacing {display:table!important;}
    img.header_image {width:400px!important;height:auto!important;}

    .header_td,
    .header_td p,
    .header_paragraph {
      font-size: 24px;
      line-height: 1.2;
      text-align: center;
    }

    .intro_td,
    .intro_td p,
    .intro_paragraph {
      font-size: 16px;
      line-height: 1.5;
      text-align: center;
    }

    }
    /*##############################################*/
    /*IPHONE STYLES*/
    /*##############################################*/
    @media only screen and (max-width: 480px) {
    a[href^="tel"], a[href^="sms"] {
    text-decoration: none;
    color: #ffffff; /* or whatever your want */
    pointer-events: none;
    cursor: default;
    }
    .mobile_link a[href^="tel"], .mobile_link a[href^="sms"] {
    text-decoration: default;
    color: #ffffff !important;
    pointer-events: auto;
    cursor: default;
    }
    .l_left,
    .l_left p {
      text-align: center;
    }
    table.devicewidth {width:100%!important;text-align:center!important;}
    table.devicewidthinner {width:300px!important;text-align:center!important;}
    table.devicewidthinnersuper {width:250px!important;text-align:center!important;}
    table.mobile_spacing {display:table!important;}
    img.header_image {width:300px!important;height:auto!important;}

    .bordered { border: 3px solid #000; border-top: 0; }

    .header_td,
    .header_td p,
    .header_paragraph {
      font-size: 22px;
      line-height: 1.1;
      text-align: center;
    }

    .intro_td,
    .intro_td p,
    .intro_paragraph {
      font-size: 16px;
      line-height: 1.4;
      text-align: center;
    }

    }
  </style>
</head>

<body style="-ms-text-size-adjust: 100%; -webkit-text-size-adjust: 100%; background-color: #ececec; margin: 0; padding: 0; width: 100% !important;">

<!-- header -->
<div class="block">
   <table width="100%" bgcolor="#ececec" cellpadding="0" cellspacing="0" border="0" id="backgroundTable" style="border-collapse: collapse; line-height: 100% !important; margin: 0; mso-table-lspace: 0pt; mso-table-rspace: 0pt; padding: 0; width: 100% !important;">
      <tbody>
        <tr>
          <td style="border-collapse: collapse;">
            <table width="600" cellpadding="0" cellspacing="0" border="0" align="center" class="devicewidth" style="border-collapse: collapse; mso-table-lspace: 0pt; mso-table-rspace: 0pt; text-align: center !important; width: 100% !important;">
              <tbody>
                <!-- spacing -->
                <tr>
                  <td width="100%" height="30" style="border-collapse: collapse;"></td>
                </tr>
                <!-- /spacing -->
              </tbody>
            </table>
          </td>
        </tr>
      </tbody>
   </table>
</div>
<!-- /header -->

<!-- intro -->
<div class="block">
  <table width="100%" bgcolor="#ececec" cellpadding="0" cellspacing="0" border="0" align="center" id="backgroundTable" style="border-collapse: collapse; line-height: 100% !important; margin: 0; mso-table-lspace: 0pt; mso-table-rspace: 0pt; padding: 0; width: 100% !important;">
    <tbody>
      <tr>
        <td style="border-collapse: collapse;">
          <table width="600" cellpadding="0" cellspacing="0" border="0" align="center" class="devicewidth" style="border-collapse: collapse; mso-table-lspace: 0pt; mso-table-rspace: 0pt; text-align: center !important; width: 100% !important;">
            <tbody>
              <!-- spacing -->
              <!-- <tr>
                <td width="100%" height="30"></td>
              </tr> -->
              <!-- /spacing -->
              <!-- logo -->
              <!-- <tr>
                <td align="center">
                  <img border="0" alt="" src="http://placehold.it/200x80" class="header_image" style="display: block;">
                </td>
              </tr> -->
              <!-- /logo -->
              <tr>
                <td style="border-collapse: collapse;">
                  <table width="480" bgcolor="#ffffff" cellpadding="0" cellspacing="0" border="0" align="center" class="devicewidthinner" style="border-collapse: collapse; mso-table-lspace: 0pt; mso-table-rspace: 0pt; text-align: center !important; width: 600px !important;">
                    <tbody>
                      <!-- spacing -->
                      <tr>
                        <td width="100%" height="30" style="border-collapse: collapse;"></td>
                      </tr>
                      <!-- /spacing -->
                      <!-- title -->
                      <tr>
                        <td style="border-collapse: collapse;">
                          <table width="420" bgcolor="#ffffff" cellpadding="0" cellspacing="0" border="0" align="center" class="devicewidthinnersuper" style="border-collapse: collapse; mso-table-lspace: 0pt; mso-table-rspace: 0pt; text-align: center !important; width: 500px !important;">
                            <tbody>
                              <tr>
                                <td class="header_td" style="border-collapse: collapse; color: #000000; font-family: Arial, sans-serif; font-size: 32px; font-weight: 700; line-height: 1.3; text-align: left;">
                                  {{ subject }}
                                </td>
                              </tr>
                              <!-- spacing -->
                              <tr>
                                <td height="30" style="border-collapse: collapse;"></td>
                              </tr>
                              <!-- /spacing -->
                              <tr>
                                <td class="intro_td" style="border-collapse: collapse; color: #000000; font-family: Arial, sans-serif; font-size: 18px; font-weight: 300; line-height: 1.5; text-align: left;">
                                  {{ body }}
                                </td>
                              </tr>
                              <!-- spacing -->
                              <tr>
                                <td width="100%" height="30" style="border-collapse: collapse;"></td>
                              </tr>
                              <!-- /spacing -->
                            </tbody>
                          </table>
                        </td>
                      </tr>
                      <!-- /title -->
                      <!-- spacing -->
                      <tr>
                        <td width="100%" height="20" style="border-collapse: collapse;"></td>
                      </tr>
                      <!-- /spacing -->
                    </tbody>
                  </table>
                </td>
              </tr>
            </tbody>
          </table>
        </td>
      </tr>
    </tbody>
  </table>
</div>
<!-- /intro -->

<!-- footer -->
<div class="block">
   <table width="100%" bgcolor="#ececec" cellpadding="0" cellspacing="0" border="0" id="backgroundTable" style="border-collapse: collapse; line-height: 100% !important; margin: 0; mso-table-lspace: 0pt; mso-table-rspace: 0pt; padding: 0; width: 100% !important;">
      <tbody>
        <tr>
          <td style="border-collapse: collapse;">
            <table width="600" cellpadding="0" cellspacing="0" border="0" align="center" class="devicewidth" style="border-collapse: collapse; mso-table-lspace: 0pt; mso-table-rspace: 0pt; text-align: center !important; width: 100% !important;">
              <tbody>
                <!-- spacing -->
                <tr>
                  <td width="100%" height="50" style="border-collapse: collapse;"></td>
                </tr>
                <!-- /spacing -->
              </tbody>
            </table>
          </td>
        </tr>
      </tbody>
   </table>
</div>
<!-- /footer -->

</body>
</html>
